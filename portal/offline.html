<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f7a4d">
<title>Monkeynastix: offline</title>
<style>
:root { --bg: #f6f5f1; --fg: #1d2330; --muted: #5d6573; --accent: #1f7a4d; }
@media (prefers-color-scheme: dark) { :root { --bg: #11151c; --fg: #eef1f6; --muted: #9aa3b2; --accent: #5fd39a; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; text-align: center; }
main { max-width: 420px; }
img { width: 140px; height: auto; }
h1 { font-size: 1.4rem; margin: 12px 0 8px; }
p { color: var(--muted); margin: 0 0 16px; }
button { font: inherit; font-weight: 700; color: #fff; background: var(--accent); border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="img/mascots.webp" width="900" height="872" alt="">
  <h1>You are offline</h1>
  <p>The portal needs a connection to load your franchise details. Reconnect and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
